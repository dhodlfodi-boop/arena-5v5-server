<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NEON FRONT // 5v5</title>
<style>
:root{--bg:#081018;--panel:#101b26;--line:#284354;--cyan:#58e5ff;--red:#ff5d72;--text:#e7f6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#18354a 0,#081018 45%);color:var(--text);font:14px system-ui,sans-serif;min-height:100vh}header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);background:#081018dd;position:sticky;top:0;z-index:2}.brand{letter-spacing:.18em;font-weight:900}.pill{padding:6px 9px;border:1px solid var(--line);border-radius:999px;color:var(--cyan);font-size:12px}.shell{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:280px 1fr;gap:16px}.panel{background:#0e1a25dd;border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 12px 40px #0005}.label{color:#8aa7b8;font-size:11px;text-transform:uppercase;letter-spacing:.12em}.big{font-size:26px;font-weight:800;margin:4px 0 18px}.stat{display:flex;justify-content:space-between;border-bottom:1px solid #203342;padding:9px 0}.cyan{color:var(--cyan)}.red{color:var(--red)}.arena{position:relative;aspect-ratio:16/9;min-height:360px;overflow:hidden;border-radius:14px;border:1px solid #31566a;background:linear-gradient(135deg,#152a35,#0d1821)}.arena:before{content:"";position:absolute;inset:12%;border:1px dashed #6bd8ff44;box-shadow:inset 0 0 0 1px #ff617322}.mid{position:absolute;left:50%;top:12%;bottom:12%;border-left:1px dashed #ccefff33}.player{position:absolute;width:24px;height:24px;border-radius:7px;transform:translate(-50%,-50%);display:grid;place-items:center;font-size:10px;font-weight:900;transition:left .05s,top .05s}.player.red{background:#ff5d72;box-shadow:0 0 18px #ff5d72aa}.player.blue{background:#58e5ff;color:#06202a;box-shadow:0 0 18px #58e5ffaa}.me{outline:2px solid white}.hud{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.score{font-weight:800}.feed{height:34px;color:#a8c8d5;overflow:hidden;margin-top:10px}.controls{display:flex;justify-content:space-between;align-items:end;margin-top:14px}.dpad{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,42px);gap:5px}.dpad button:nth-child(1){grid-column:2}.dpad button:nth-child(2){grid-column:1}.dpad button:nth-child(3){grid-column:2}.dpad button:nth-child(4){grid-column:3}button{border:1px solid #3b6478;background:#122a36;color:var(--text);border-radius:9px;padding:10px 12px;cursor:pointer}button:active{transform:translateY(1px);background:#1d4c5e}.fire{border-color:#ff5d72;background:#4b1c2b;font-weight:900;min-width:100px;height:74px}.form,.row{display:flex;gap:8px}.form{margin-bottom:10px}.form input,.row input{min-width:0;flex:1;border-radius:8px;border:1px solid var(--line);background:#07121a;color:white;padding:10px}.hint{color:#92abb7;font-size:12px;line-height:1.55}.admin{display:none;margin-top:12px;border-color:#8d5de8}.admin.on{display:block}.inventory{margin-top:16px;padding-top:12px;border-top:1px solid #203342}.item-group{margin:10px 0}.items{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.item{font-size:11px;padding:7px 8px;border:1px solid #31566a;background:#0b202b;border-radius:8px;color:#bcecff}.item.equipped{border-color:#f5d76e;color:#f5d76e}.item:disabled{opacity:.45;cursor:not-allowed}.current{font-size:12px;color:#f5d76e;min-height:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}.panel.side{order:2}.arena{min-height:300px}.shell{padding:10px}header{padding:12px}.controls{position:sticky;bottom:0;background:#081018e8;padding:8px 0}.big{font-size:22px}}
</style>
</head>
<body>
<header><div class="brand">NEON FRONT</div><div><span class="pill" id="conn">OFFLINE</span> <span class="pill">5V5 ONLINE</span></div></header>
<main class="shell">
  <div class="form"><input id="name" placeholder="닉네임" maxlength="18" value="Player"><input id="url" placeholder="ws://localhost:8787/ws"><button id="join">접속</button></div>
  <div class="grid">
    <aside class="panel side">
      <div class="label">PLAYER PROFILE</div><div class="big" id="who">접속 대기</div>
      <div class="stat"><span>팀</span><b id="team">-</b></div><div class="stat"><span>게임 포인트</span><b class="cyan" id="points">0P</b></div><div class="stat"><span>게임패스</span><b id="pass">없음</b></div><div class="stat"><span>랭크</span><b id="rank">Bronze</b></div>
      <div class="inventory"><div class="label">LOADOUT</div><div class="current" id="current">장착 대기</div><div class="item-group"><div class="label">WEAPONS</div><div class="items" id="weapons"></div></div><div class="item-group"><div class="label">SKINS</div><div class="items" id="skins"></div></div></div>
      <p class="hint">PC: WASD 또는 방향키로 이동<br>모바일: 아래 방향키 사용<br>아이템은 서버가 게임패스 권한을 검증합니다.</p>
      <div class="admin" id="admin"><div class="label">ADMIN CONSOLE</div><div class="row"><input id="cmd" placeholder="/help"><button id="sendcmd">실행</button></div></div>
    </aside>
    <section><div class="hud"><div class="score"><span class="red">RED <b id="redscore">0</b></span> : <span class="cyan">BLUE <b id="bluescore">0</b></span></div><div id="round">LOBBY</div></div><div class="hud"><div id="objective">WAR OBJECTIVE · 중립 0%</div><div id="kills">KILLS 0 : 0</div></div><div class="arena" id="arena"><div class="mid"></div></div><div class="feed" id="feed">서버 주소를 입력하고 접속하세요.</div><div class="controls"><div class="dpad"><button data-dx="0" data-dy="-1">▲</button><button data-dx="-1" data-dy="0">◀</button><button data-dx="0" data-dy="1">▼</button><button data-dx="1" data-dy="0">▶</button></div><button class="fire" id="fire">FIRE</button></div></section>
  </div>
</main>
<script>
let ws, meId, currentInventory, hold={dx:0,dy:0};
const $=id=>document.getElementById(id);
function say(t){$('feed').textContent=t}
function endpoint(){return $('url').value||`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`}
function connect(){ws=new WebSocket(endpoint());ws.onopen=()=>{$('conn').textContent='ONLINE';ws.send(JSON.stringify({type:'join',name:$('name').value||'Player',adminToken:sessionStorage.getItem('adminToken')||''}));say('서버에 연결됨')};ws.onclose=()=>{$('conn').textContent='OFFLINE';say('연결이 종료되었습니다.')};ws.onerror=()=>say('서버 연결 실패');ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='welcome'){meId=m.id;$('who').textContent=$('name').value;if(m.role==='admin')$('admin').classList.add('on');wallet(m);renderInventory(m.inventory);return}if(m.type==='state')render(m);if(m.type==='wallet')wallet(m);if(m.type==='inventory')renderInventory(m.inventory);if(m.type==='loadout'){currentInventory.equipped=m.equipped;renderInventory(currentInventory)}if(m.type==='kill')say(`⚔ ${m.killer} → ${m.victim} · ${m.weapon}`);if(m.type==='hit'&&m.target===meId)say(`피격! ${m.damage} 피해 · HP ${m.hp}`);if(m.type==='notice')say(m.text);if(m.type==='moderation')say(`정지 처리: ${m.minutes}분`)}}
function wallet(m){$('points').textContent=(m.points??0).toLocaleString()+'P';$('pass').textContent=(m.pass||'none').toUpperCase()}
function renderInventory(inv){if(!inv)return;currentInventory=inv;const renderGroup=(type,target)=>{$(target).innerHTML='';for(const item of inv[type]||[]){const b=document.createElement('button');b.className='item '+(inv.equipped?.[type]===item.id?'equipped':'');b.textContent=item.name;b.title=`${item.pass.toUpperCase()} 패스 아이템`;b.onclick=()=>equip(type,item.id);$(target).appendChild(b)}};renderGroup('weapons','weapons');renderGroup('skins','skins');$('current').textContent=`장착 총: ${inv.equipped?.weapons||'-'} · 스킨: ${inv.equipped?.skins||'-'}`}
function equip(type,id){if(ws?.readyState===1)ws.send(JSON.stringify({type:'equip',itemType:type,itemId:id}))}
function render(s){$('round').textContent=`ROUND ${s.round} · ${s.phase.toUpperCase()}`;$('redscore').textContent=s.score.red;$('bluescore').textContent=s.score.blue;$('kills').textContent=`KILLS ${s.kills.red} : ${s.kills.blue}`;$('objective').textContent=`WAR OBJECTIVE · ${(s.objective.owner||'중립').toUpperCase()} ${s.objective.progress}%`;$('arena').querySelectorAll('.player').forEach(x=>x.remove());for(const p of s.players){const el=document.createElement('div');el.className=`player ${p.team} ${p.id===meId?'me':''}`;el.style.left=(p.x/1000*100)+'%';el.style.top=(p.y/600*100)+'%';el.textContent=p.alive?p.name.slice(0,2):'✕';el.title=`${p.name} · ${p.hp}HP · K${p.kills}/D${p.deaths} · ${p.equipped?.weapons||''}`;$('arena').appendChild(el);if(p.id===meId){$('team').textContent=p.team.toUpperCase();wallet(p);if(currentInventory)currentInventory.equipped=p.equipped;}}}
function input(dx,dy,fire=false){if(ws?.readyState===1)ws.send(JSON.stringify({type:'input',dx,dy,fire}))}
document.querySelectorAll('[data-dx]').forEach(b=>{b.onpointerdown=()=>{hold={dx:+b.dataset.dx,dy:+b.dataset.dy};input(hold.dx,hold.dy)};b.onpointerup=b.onpointercancel=()=>hold={dx:0,dy:0}});$('fire').onpointerdown=()=>input(hold.dx,hold.dy,true);$('join').onclick=connect;$('sendcmd').onclick=()=>{if(ws?.readyState===1)ws.send(JSON.stringify({type:'admin',command:$('cmd').value}));$('cmd').value=''};
document.addEventListener('keydown',e=>{const map={w:[0,-1],ArrowUp:[0,-1],s:[0,1],ArrowDown:[0,1],a:[-1,0],ArrowLeft:[-1,0],d:[1,0],ArrowRight:[1,0]};if(map[e.key]){e.preventDefault();hold={dx:map[e.key][0],dy:map[e.key][1]};input(hold.dx,hold.dy)}if(e.code==='Space')input(hold.dx,hold.dy,true)});document.addEventListener('keyup',e=>{if(['w','a','s','d','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))hold={dx:0,dy:0}});
</script>
</body></html>
