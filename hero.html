<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEON FRONT // HERO OPS</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#050a10;color:#eaf8ff;font-family:system-ui,sans-serif}#game{position:fixed;inset:0}#hud{position:fixed;inset:0;pointer-events:none}.top{display:flex;justify-content:space-between;align-items:start;padding:18px 24px}.brand{font-weight:900;letter-spacing:.22em;color:#dff9ff}.match{background:#07131dd9;border:1px solid #3c6375;border-radius:12px;padding:10px 14px;text-align:center}.score{font-size:22px;font-weight:900}.red{color:#ff6680}.blue{color:#59e5ff}.sub{font-size:11px;color:#8aaebb;letter-spacing:.1em}.hero{pointer-events:auto;position:absolute;left:24px;bottom:24px;background:#07131ddd;border:1px solid #3c6375;border-radius:14px;padding:12px;width:220px}.hero strong{font-size:20px}.bar{height:7px;background:#223641;border-radius:10px;overflow:hidden;margin:7px 0}.hp{height:100%;width:100%;background:#61e5a2}.abilities{display:flex;gap:7px;margin-top:10px}.ability{width:42px;height:42px;border:1px solid #527487;border-radius:9px;background:#132633;color:#fff;text-align:center;line-height:20px;padding-top:5px;font-weight:800}.ability small{font-size:9px}.cross{position:absolute;left:50%;top:50%;width:24px;height:24px;transform:translate(-50%,-50%)}.cross:before,.cross:after{content:"";position:absolute;background:#dffaff;box-shadow:0 0 7px #58e5ff}.cross:before{left:11px;top:0;width:2px;height:24px}.cross:after{left:0;top:11px;width:24px;height:2px}.objective{position:absolute;left:50%;top:22px;transform:translateX(-50%);background:#07131ddd;border:1px solid #3c6375;border-radius:999px;padding:8px 14px;font-size:12px}.feed{position:absolute;right:24px;bottom:30px;width:280px;text-align:right;color:#b4d6e3;font-size:13px}.touch{display:none;position:absolute;right:20px;bottom:22px;pointer-events:auto}.touch button{touch-action:none;user-select:none;-webkit-user-select:none;width:68px;height:68px;border-radius:50%;border:1px solid #74dced;background:#102c3bdd;color:white;font-weight:900;margin:4px}.touch .fire{border-color:#ff6680;background:#4c1d2bdd}.join{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#07131df2;border:1px solid #527487;border-radius:16px;padding:22px;width:min(360px,calc(100vw - 40px));text-align:center;pointer-events:auto}.join h1{margin:0 0 8px;letter-spacing:.08em}.join p{color:#9dbac6;font-size:13px}.join input{width:100%;padding:12px;box-sizing:border-box;border-radius:8px;border:1px solid #3c6375;background:#08151e;color:#fff;margin:8px 0}.join button{padding:12px 20px;border-radius:8px;border:1px solid #58e5ff;background:#123b4b;color:white;font-weight:800;width:100%}.asset-status{position:absolute;right:24px;bottom:92px;color:#9dbac6;font-size:11px}@media(max-width:700px){.top{padding:12px}.hero{left:12px;bottom:12px;width:190px}.feed{right:12px;bottom:110px;width:200px}.touch{display:block}.objective{top:12px}.join{padding:18px}}
</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head><body><div id="game"></div><div id="hud"><div class="top"><div><div class="brand">NEON FRONT // HERO OPS</div><div class="sub">TACTICAL WARZONE · 5V5</div></div><div class="match"><div class="score"><span class="red" id="red">0</span> : <span class="blue" id="blue">0</span></div><div class="sub" id="round">LOBBY · OFFLINE</div></div></div><div class="objective" id="objective">OBJECTIVE A · NEUTRAL 0%</div><div class="cross"></div><div class="asset-status" id="assetStatus">3D ASSETS · LOADING</div><div class="hero"><div><strong>VANTA</strong> <span class="sub">RECON</span></div><div class="sub">HP <span id="hp">100</span> / 100</div><div class="bar"><div class="hp" id="hpbar"></div></div><div class="abilities"><div class="ability" id="q">Q<br><small>SCAN</small></div><div class="ability" id="e">E<br><small>SMOKE</small></div><div class="ability" id="r">R<br><small>CORE</small></div></div></div><div class="feed" id="feed">서버에 접속하면 전투가 시작됩니다.</div><div class="touch"><button data-dx="-1" data-dy="0">◀</button><button class="fire" id="fire">FIRE</button><button data-dx="1" data-dy="0">▶</button><br><button data-dx="0" data-dy="-1">▲</button><button data-dx="0" data-dy="1">▼</button></div><div class="join" id="join"><h1>HERO OPS</h1><p>3D 전술 전투에 참가하세요.<br>PC: WASD · FIRE: Space / 클릭</p><input id="name" value="Vanta" maxlength="18" placeholder="닉네임"><button id="start">전투 참가</button></div></div><script type="module">
import * as THREE from 'https://esm.sh/three@0.160.0';
import {GLTFLoader} from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x071018);scene.fog=new THREE.Fog(0x071018,35,100);const camera=new THREE.PerspectiveCamera(68,innerWidth/innerHeight,.1,200);camera.position.set(0,2.4,12);scene.add(camera);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.getElementById('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0x91eaff,0x071018,1.8));const key=new THREE.DirectionalLight(0xffffff,2);key.position.set(5,12,4);scene.add(key);const loader=new GLTFLoader();let heroAsset=null,weaponAsset=null,weaponModel=null,loaded=0;function assetReady(){loaded++;$('assetStatus').textContent=loaded===2?'3D ASSETS · VANTA + PULSE RIFLE':'3D ASSETS · LOADING'}loader.load('/assets/vanta_hero.glb',g=>{heroAsset=g.scene;assetReady()},undefined,()=>{say('영웅 모델 로드 실패 · 연결 확인 필요');assetReady()});loader.load('/assets/pulse_rifle.glb',g=>{weaponAsset=g.scene;weaponModel=weaponAsset.clone();weaponModel.scale.setScalar(.95);weaponModel.position.set(.62,-.48,-1.05);weaponModel.rotation.set(0,Math.PI,0);camera.add(weaponModel);assetReady()},undefined,()=>{say('총기 모델 로드 실패 · 연결 확인 필요');assetReady()});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(70,42),new THREE.MeshStandardMaterial({color:0x132832,roughness:.82,metalness:.1}));floor.rotation.x=-Math.PI/2;scene.add(floor);const grid=new THREE.GridHelper(70,35,0x397587,0x1a3c4b);grid.position.y=.01;scene.add(grid);function box(x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:c,roughness:.5,metalness:.2}));m.position.set(x,y,z);scene.add(m);return m}for(const p of [[0,1,-18,70,2,1,0x1c4350],[0,1,18,70,2,1,0x1c4350],[-34,1,0,1,2,36,0x1c4350],[34,1,0,1,2,36,0x1c4350],[-10,1,-5,5,2,2,0x245162],[9,1,4,6,2,2,0x245162]])box(...p);const objective=box(0,.08,0,6,.1,6,0x2e6d72);objective.material.emissive=new THREE.Color(0x123e45);const objectiveRing=new THREE.Mesh(new THREE.RingGeometry(3.1,3.25,48),new THREE.MeshBasicMaterial({color:0x58e5ff,side:THREE.DoubleSide}));objectiveRing.rotation.x=-Math.PI/2;objectiveRing.position.y=.12;scene.add(objectiveRing);
const players=new Map(),effectMeshes=new Map(),cooldowns={scan:0,smoke:0};let meId=null,ws,hold={dx:0,dy:0};const $=id=>document.getElementById(id);function say(t){$('feed').textContent=t}function createPlayerMesh(team){if(heroAsset){const model=heroAsset.clone();model.scale.setScalar(2.4);model.traverse(o=>{if(o.isMesh)o.material=o.material.clone()});return model}return box(0,1,0,1.1,2,1.1,team==='red'?0xff526c:0x50d9ec)}function connect(){ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);ws.onopen=()=>{ws.send(JSON.stringify({type:'join',name:$('name').value||'Vanta'}));say('작전 서버 연결 · 전투 대기')};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='welcome'){meId=m.id;$('join').style.display='none';say('VANTA 온라인 · 목표 지점으로 이동하세요')}if(m.type==='state')state(m);if(m.type==='kill')say(`⚔ ${m.killer} → ${m.victim}`);if(m.type==='hit'&&m.target===meId)say(`피격 ${m.damage} · 후퇴 필요`);if(m.type==='ability_cooldown')startCooldown(m.name,m.cooldownMs);if(m.type==='ability_denied')say(`${m.name.toUpperCase()} · ${m.reason}`);if(m.type==='ability'){if(m.name==='scan')showScan(m);if(m.name==='smoke')say('연막 전개 · 시야 차단 구역 생성')}if(m.type==='notice')say(m.text)};ws.onclose=()=>say('서버 연결 종료')}
function showScan(m){const ring=new THREE.Mesh(new THREE.RingGeometry(.4,4.5,48),new THREE.MeshBasicMaterial({color:m.team==='red'?0xff6680:0x58e5ff,transparent:true,opacity:.8,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set((m.x-500)/20,.2,(m.y-300)/10);scene.add(ring);const started=performance.now();function pulse(t){const p=Math.min(1,(t-started)/m.durationMs);ring.scale.setScalar(.6+p*1.5);ring.material.opacity=.8*(1-p);if(p<1)requestAnimationFrame(pulse);else scene.remove(ring)}requestAnimationFrame(pulse);say(`SCAN · 적 ${m.revealed?.length||0}명 탐지`)}function startCooldown(name,ms){cooldowns[name]=Date.now()+ms}setInterval(()=>{for(const name of ['scan','smoke']){const left=Math.max(0,cooldowns[name]-Date.now());const el=$(name==='scan'?'q':'e');el.style.opacity=left?'0.5':'1';el.innerHTML=left?`${Math.ceil(left/1000)}s`:(name==='scan'?'Q<br><small>SCAN</small>':'E<br><small>SMOKE</small>')}},100);function renderEffects(effects=[]){const active=new Set();for(const e of effects){active.add(e.id);let mesh=effectMeshes.get(e.id);if(!mesh){mesh=new THREE.Mesh(new THREE.SphereGeometry(e.radius/32,24,16),new THREE.MeshStandardMaterial({color:0x172636,transparent:true,opacity:.52,roughness:1}));scene.add(mesh);effectMeshes.set(e.id,mesh)}mesh.position.set((e.x-500)/20,2,(e.y-300)/10)}for(const [id,mesh] of effectMeshes){if(!active.has(id)){scene.remove(mesh);effectMeshes.delete(id)}}}function useAbility(name){if(ws?.readyState===1)ws.send(JSON.stringify({type:'ability',name}))}function state(s){renderEffects(s.effects);$('red').textContent=s.score.red;$('blue').textContent=s.score.blue;$('round').textContent=`${s.mode?.toUpperCase()||'WAR'} · ROUND ${s.round} · ${s.phase.toUpperCase()}`;$('objective').textContent=`OBJECTIVE A · ${(s.objective.owner||'NEUTRAL').toUpperCase()} ${s.objective.progress}%`;for(const p of s.players){let obj=players.get(p.id);if(!obj){obj=createPlayerMesh(p.team);obj.userData.id=p.id;players.set(p.id,obj);scene.add(obj)}obj.position.x=(p.x-500)/20;obj.position.z=(p.y-300)/10;obj.visible=p.alive;if(p.id===meId){camera.position.x=obj.position.x;camera.position.z=obj.position.z+5;camera.lookAt(obj.position.x,1.8,obj.position.z-5);$('hp').textContent=p.hp;$('hpbar').style.width=p.hp+'%'}}}
function input(dx,dy,fire=false){if(ws?.readyState===1)ws.send(JSON.stringify({type:'input',dx,dy,fire}))}let moveTimer=null,fireTimer=null;function stopMove(){if(moveTimer){clearInterval(moveTimer);moveTimer=null}hold={dx:0,dy:0}}function ability(id){useAbility(id==='q'?'scan':'smoke')}function startMove(dx,dy){if(moveTimer)clearInterval(moveTimer);hold={dx,dy};input(dx,dy);moveTimer=setInterval(()=>input(dx,dy),80)}function stopFire(){if(fireTimer){clearInterval(fireTimer);fireTimer=null}}function startFire(){stopFire();input(hold.dx,hold.dy,true);fireTimer=setInterval(()=>input(hold.dx,hold.dy,true),140)}$('start').onclick=connect;$('q').onclick=()=>ability('q');$('e').onclick=()=>ability('e');$('r').onclick=()=>ability('r');$('fire').onpointerdown=e=>{e.preventDefault();startFire()};$('fire').onpointerup=$('fire').onpointercancel=stopFire;document.querySelectorAll('[data-dx]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();startMove(+b.dataset.dx,+b.dataset.dy)};b.onpointerup=b.onpointercancel=stopMove});document.addEventListener('keydown',e=>{const m={w:[0,-1],ArrowUp:[0,-1],s:[0,1],ArrowDown:[0,1],a:[-1,0],ArrowLeft:[-1,0],d:[1,0],ArrowRight:[1,0]};if(m[e.key])startMove(m[e.key][0],m[e.key][1]);if(e.code==='Space')startFire();if(e.key==='q')ability('q');if(e.key==='e')ability('e')});document.addEventListener('keyup',e=>{if(e.code==='Space')stopFire();else if(e.key)stopMove()});document.addEventListener('contextmenu',e=>e.preventDefault());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);renderer.render(scene,camera)}loop();
</script></body></html>
